name: e2e

on:
  pull_request:
  push:
    branches: [main]
  # The full suite (3.13): nightly at 03:00 Melbourne (AEDT), and on demand.
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Microsoft's Playwright image already holds the browsers and the system libraries they need, so
    # this job has no `playwright install --with-deps` step. That step's apt downloads from the runner's
    # Ubuntu mirror hung for 6–20 min in 7 of 30 runs (2026-11-17 to 2026-11-20). Pinned by digest
    # (the multi-arch index). Bump the tag and digest together with @playwright/test: the next step
    # fails if they don't match. The full job stays on the runner, where its screenshot baselines were
    # made.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the image has this Playwright version's browsers
        run: |
          missing=0
          for dir in $(pnpm exec playwright install --dry-run chromium webkit | sed -n 's/^ *Install location: *//p'); do
            if [ ! -d "$dir" ]; then echo "::error::$dir is not in the container image"; missing=1; fi
          done
          if [ "$missing" = 1 ]; then
            echo "::error::@playwright/test $(node -p 'require("@playwright/test/package.json").version') needs a matching mcr.microsoft.com/playwright image: update the smoke job's container in e2e.yml"
            exit 1
          fi
      - run: pnpm build
      - run: pnpm e2e:smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The full suite (PR 3.13; Hugh: main and nightly, not every PR). Every journey at every agreed
  # viewport, including the database-backed detail pages (E2E_DB=1) against the LOCAL Supabase stack
  # on this runner, with the WebGL-free FakeMap. No hosted service, token or secret is used.
  full:
    name: full
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium webkit
      # Postgres (migrated and seeded on a fresh runner) plus Storage and its gateway for the photos;
      # the rest of the stack is skipped, as in the database job (ci.yml).
      - run: pnpm db:start -x gotrue,realtime,imgproxy,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      # The fake map and a fake GA4 id (PR 4.1: the consent banner and analytics code run, nothing is
      # sent to Google) are baked in at build time (NEXT_PUBLIC_*); the server's database and media
      # URLs are the local ones, set by playwright.config.ts when it starts the app.
      - run: pnpm build
        env:
          NEXT_PUBLIC_MAP_ADAPTER: fake
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-E2ETEST000
      - run: pnpm e2e
        env:
          E2E_DB: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-full
          path: playwright-report/
          retention-days: 7
