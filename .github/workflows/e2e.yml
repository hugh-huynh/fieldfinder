name: e2e

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Official Playwright image: browsers and their OS libraries are preinstalled, so there is no
    # per-run `playwright install --with-deps`. Pinned by digest. Must match @playwright/test:
    # when that is bumped, update the tag AND digest here (the check step below fails otherwise).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check image browsers match @playwright/test
        run: |
          missing=0
          for dir in $(pnpm exec playwright install --dry-run chromium webkit | awk '/Install location:/ {print $3}'); do
            if [ ! -d "$dir" ]; then
              echo "::error::$dir is not in the container image. Update the image to v$(node -p 'require("@playwright/test/package.json").version')-noble (tag and digest)."
              missing=1
            fi
          done
          exit "$missing"
      - run: pnpm build
      - run: pnpm e2e:smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
