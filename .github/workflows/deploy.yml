name: deploy

# Production deploys are manual and gated by the `production` environment's required reviewers.
# Inert until the environment and its secrets exist (M4). Git-triggered production deploys are
# disabled in vercel.json, so this workflow is the only path to production.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  production:
    name: production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dlx vercel@60.1.3 pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: pnpm dlx vercel@60.1.3 build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        id: deploy
        # The deploy runs as its own assignment so `set -e` sees its exit status. Wrapped inside
        # `echo "url=$(…)"` a failed deploy was masked by echo's success and reported as deployed.
        run: |
          set -euo pipefail
          output="$(pnpm dlx vercel@60.1.3 deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          url="$(printf '%s\n' "$output" | tail -n 1)"
          if [[ ! "$url" =~ ^https://[A-Za-z0-9.-]+(/[^[:space:]]*)?$ ]]; then
            echo "::error::vercel deploy exited 0 but did not print a deployment URL"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Summary
        run: echo "Deployed $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
      # M4: post-deploy smoke tests against the production URL + rollback runbook.
