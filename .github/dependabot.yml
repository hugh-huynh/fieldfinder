version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Australia/Melbourne
    open-pull-requests-limit: 5
    # Let new releases settle before proposing them; security updates are not delayed.
    cooldown:
      default-days: 14
    ignore:
      # Types must match the Node runtime in .nvmrc (22); newer majors would type-check APIs that crash at runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-jsx-a11y 6.10 supports ESLint <= 9; revisit when it supports 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
    groups:
      next-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
      lint-format:
        patterns: ["eslint", "@eslint/*", "typescript-eslint", "eslint-plugin-*", "prettier", "prettier-plugin-*"]
      test-tooling:
        patterns: ["vitest", "@vitest/*", "@testing-library/*", "jsdom", "msw", "@playwright/test", "@axe-core/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Australia/Melbourne
    cooldown:
      default-days: 14
